name: Hold
options:
  bundleIdPrefix: com.fabi2418
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hold:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabi2418.hold
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
  HoldTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/Model
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabi2418.hold.tests
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
schemes:
  Hold:
    build:
      targets:
        Hold: all
        HoldTests: [test]
    test:
      targets:
        - HoldTests
